# Azure DevOps build agents as CONFIDENTIAL ACI on AKS Virtual Nodes
# ------------------------------------------------------------------
# This manifest replaces standalone confidential ACI build agents with the
# same agents scheduled onto an AKS **virtual node**. The pod runtime is
# provided by Azure Container Instances, and the
#   virtual-kubelet.io/confidential-compute-cce-policy
# annotation turns each backing container group into a confidential
# (AMD SEV-SNP) ACI instance governed by a CCE policy.
#
# The placeholders below (__UPPER_CASE__) are substituted by
# Build-AksVirtualNodesAdoAgent.ps1 at deploy time. You can also copy this
# file, replace the placeholders by hand, and `kubectl apply -f` it.
#
# Key pieces
# ----------
#   annotations:
#     virtual-kubelet.io/confidential-compute-cce-policy
#       Base64-encoded Rego CCE policy. This is the annotation key the deployed
#       azure-aci virtual-kubelet provider actually READS (see aci.go:
#       confidentialComputeCcePolicyLabel). NOTE the mismatch: the
#       `az confcom acipolicygen --virtual-node-yaml` tool WRITES its generated
#       policy to a DIFFERENT key, `microsoft.containerinstance.virtualnode.ccepolicy`.
#       Build-AksVirtualNodesAdoAgent.ps1 therefore runs confcom and then copies
#       the generated value into the vk.io key below before applying, so the
#       policy lands where the provider reads it. If the vk.io key is left empty
#       the provider falls back to a permissive default allow-all policy and
#       `az container exec` (a terminal into the runner) succeeds. The value
#       baked in here by the script is either:
#         * a restrictive, image-bound policy generated with (DEFAULT):
#             az confcom acipolicygen --virtual-node-yaml <this-file> --disable-stdio
#           This pins the image digest + per-layer hashes and has no
#           exec_processes / allow_stdio_access, so `az container exec`
#           (a terminal into the runner) is refused, or
#         * the allow-all DEBUG policy (foundation / plumbing validation only,
#           does NOT block exec).
#       Deploy with -PolicyMode generated and never trust a debug-policy
#       runner with secrets.
#
#   nodeSelector / tolerations
#       Target the virtual node (type=virtual-kubelet) so the pod runs on ACI
#       instead of a regular AKS VM node.
#
#   AZP_* environment
#       The agent self-registers to the self-hosted Azure DevOps Server over
#       the private VNet (AZP_URL points at the server's private IP on 443).
#       AZP_AGENT_NAME is omitted on purpose: start.sh falls back to the pod
#       hostname, which is unique per replica.
---
apiVersion: v1
kind: Namespace
metadata:
  name: ado-agents
---
apiVersion: v1
kind: Secret
metadata:
  name: ado-pat
  namespace: ado-agents
type: Opaque
stringData:
  # Azure DevOps Personal Access Token used for unattended agent registration.
  AZP_TOKEN: "__AZP_TOKEN__"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ado-confidential-agent-__RUNNER_SET__
  namespace: ado-agents
  labels:
    app: ado-confidential-agent-__RUNNER_SET__
    runner-set: "__RUNNER_SET__"
spec:
  replicas: __REPLICAS__
  selector:
    matchLabels:
      app: ado-confidential-agent-__RUNNER_SET__
  template:
    metadata:
      labels:
        app: ado-confidential-agent-__RUNNER_SET__
        runner-set: "__RUNNER_SET__"
      annotations:
        # -------------------------------------------------------------------
        # CCE policy (REQUIRED for confidential ACI on virtual nodes).
        # The azure-aci virtual-kubelet provider reads:
        #   virtual-kubelet.io/container-sku                     -> "confidential"
        #   virtual-kubelet.io/confidential-compute-cce-policy   -> base64 Rego
        # IMPORTANT: `az confcom acipolicygen --virtual-node-yaml` writes its
        # generated policy to a DIFFERENT key
        # (microsoft.containerinstance.virtualnode.ccepolicy), so the deploy
        # script runs confcom and then copies that value into the vk.io key
        # below (the one the provider reads) before applying. When the vk.io
        # key is populated the provider sets the backing container group SKU to
        # Confidential and enforces the policy; if it is left empty the provider
        # falls back to a permissive allow-all default and a terminal can be
        # opened into the runner. The script deploys a generated, image-bound
        # restrictive policy by default (-PolicyMode generated), forces pod
        # recreation so a fresh container group is launched under the new
        # policy, and verifies the LIVE policy blocks exec/stdio after rollout.
        # To (re)generate by hand, run the confcom command below then copy the
        # microsoft.* value into virtual-kubelet.io/confidential-compute-cce-policy:
        #   az confcom acipolicygen --virtual-node-yaml <this-file> --disable-stdio
        # -------------------------------------------------------------------
        virtual-kubelet.io/container-sku: "confidential"
        virtual-kubelet.io/confidential-compute-cce-policy: "__CCE_POLICY__"
    spec:
      imagePullSecrets:
        - name: acr-pull
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/role: agent
        type: virtual-kubelet
      tolerations:
        - key: virtual-kubelet.io/provider
          operator: Exists
        - key: azure.com/aci
          effect: NoSchedule
      containers:
        - name: ado-agent
          image: __ACR_IMAGE__
          env:
            - name: AZP_URL
              value: "__AZP_URL__"
            - name: AZP_POOL
              value: "__AZP_POOL__"
            - name: AZP_WORK
              value: "/azp/_work"
            - name: AGENT_ALLOW_RUNASROOT
              value: "1"
            - name: AZP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ado-pat
                  key: AZP_TOKEN
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
