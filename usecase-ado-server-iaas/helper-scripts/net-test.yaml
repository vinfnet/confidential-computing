apiVersion: 2021-07-01
location: northeurope
name: net-test
properties:
  osType: Linux
  restartPolicy: Never
  subnetIds:
    - id: /subscriptions/<subscription-id>/resourceGroups/<resource-group>/providers/Microsoft.Network/virtualNetworks/<name>vnet/subnets/aci-agents-subnet
  containers:
    - name: net-test
      properties:
        image: mcr.microsoft.com/azure-cli:latest
        resources:
          requests:
            cpu: 1
            memoryInGB: 1
        command:
          - /bin/sh
          - -c
          - >
            echo TEST-START;
            echo '--- connectionData ---';
            curl -sS -m 15 -o /dev/null -w 'connect=%{time_connect} httpcode=%{http_code}\n' http://10.0.0.4/DefaultCollection/_apis/connectionData;
            echo "curl_exit=$?";
            echo '--- packages ---';
            curl -sS -m 15 -o /dev/null -w 'httpcode=%{http_code}\n' 'http://10.0.0.4/DefaultCollection/_apis/distributedtask/packages/agent?platform=linux-x64&top=1';
            echo "curl_exit=$?";
            echo TEST-END
