parameters:
  - name: buildSteps
    type: stepList
    default: []
  - name: buildPool
    type: string
    default: confidential-build-pool
  - name: provenancePool
    type: string
    default: confidential-provenance-pool
  - name: artifactDescriptorPath
    type: string
    default: '$(Build.ArtifactStagingDirectory)/provenance-input/artifact.json'
  - name: ledgerEndpoint
    type: string
  - name: ledgerCollectionId
    type: string
  - name: ledgerWriterClientId
    type: string
  - name: evidenceStorageAccountName
    type: string
  - name: evidenceContainerName
    type: string
    default: build-evidence
  - name: acrName
    type: string
  - name: syftVersion
    type: string
    default: '1.18.1'

stages:
  - stage: Build
    displayName: Build immutable artifact
    jobs:
      - job: Build
        displayName: Developer build
        pool: ${{ parameters.buildPool }}
        steps:
          - checkout: self
          - ${{ each step in parameters.buildSteps }}:
            - ${{ step }}
          - bash: |
              set -euo pipefail
              test -f '${{ parameters.artifactDescriptorPath }}'
              python3 - '${{ parameters.artifactDescriptorPath }}' <<'PY'
              import json
              import re
              import sys

              with open(sys.argv[1], encoding="utf-8") as stream:
                  descriptor = json.load(stream)
              for field in ("name", "uri", "sha256"):
                  if not isinstance(descriptor.get(field), str) or not descriptor[field]:
                      raise SystemExit(f"artifact descriptor field '{field}' is required")
              if not re.fullmatch(r"[0-9a-fA-F]{64}", descriptor["sha256"]):
                  raise SystemExit("artifact descriptor sha256 must contain 64 hex characters")
              if "@sha256:" not in descriptor["uri"]:
                  raise SystemExit("artifact descriptor uri must use an immutable @sha256 reference")
              PY
            displayName: Validate immutable artifact descriptor
          - task: PublishBuildArtifacts@1
            displayName: Publish artifact descriptor
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/provenance-input'
              ArtifactName: provenance-input
              publishLocation: Container

  - stage: Provenance
    displayName: Record mandatory provenance
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: Record
        displayName: Generate SBOM and verify ledger receipt
        pool: ${{ parameters.provenancePool }}
        steps:
          - checkout: self
          - task: DownloadBuildArtifacts@0
            displayName: Download artifact descriptor
            inputs:
              buildType: current
              downloadType: single
              artifactName: provenance-input
              downloadPath: '$(Agent.TempDirectory)'
          - bash: |
              set -euo pipefail
              if ! command -v az >/dev/null 2>&1; then
                curl -sSfL https://aka.ms/InstallAzureCLIDeb | bash
              fi
              python3 -m pip install --disable-pip-version-check \
                -r usecase-ado-server-iaas/provenance/requirements.txt
              az login --identity --client-id '${{ parameters.ledgerWriterClientId }}' \
                --allow-no-subscriptions --only-show-errors -o none
            displayName: Prepare provenance tools
          - bash: |
              set -euo pipefail
              VERSION='${{ parameters.syftVersion }}'
              TOOL_DIR='$(Agent.TempDirectory)/provenance-tools'
              mkdir -p "$TOOL_DIR"
              cd "$TOOL_DIR"
              ARCHIVE="syft_${VERSION}_linux_amd64.tar.gz"
              RELEASE="https://github.com/anchore/syft/releases/download/v${VERSION}"
              curl -sSfLO "$RELEASE/$ARCHIVE"
              curl -sSfLO "$RELEASE/syft_${VERSION}_checksums.txt"
              grep "  $ARCHIVE$" "syft_${VERSION}_checksums.txt" | sha256sum --check --strict
              tar -xzf "$ARCHIVE" syft
              chmod +x syft
            displayName: Install pinned Syft
          - bash: |
              set -euo pipefail
              INPUT='$(Agent.TempDirectory)/provenance-input/artifact.json'
              OUTPUT='$(Build.ArtifactStagingDirectory)/provenance'
              mkdir -p "$OUTPUT" "$HOME/.docker"

              IMAGE_URI=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["uri"])' "$INPUT")
              ACR_TOKEN=$(az acr login --name '${{ parameters.acrName }}' --expose-token \
                --query accessToken -o tsv)
              export SYFT_REGISTRY_AUTH_AUTHORITY="${IMAGE_URI%%/*}"
              export SYFT_REGISTRY_AUTH_USERNAME='00000000-0000-0000-0000-000000000000'
              export SYFT_REGISTRY_AUTH_PASSWORD="$ACR_TOKEN"

              '$(Agent.TempDirectory)/provenance-tools/syft' "$IMAGE_URI" \
                -o "spdx-json=$OUTPUT/sbom.spdx.json"

              BUILD_URI="${SYSTEM_COLLECTIONURI}${SYSTEM_TEAMPROJECT}/_build/results?buildId=${BUILD_BUILDID}"
              ARTIFACT_URI="$BUILD_URI&view=artifacts&type=publishedArtifacts"
              PROVENANCE_PREFIX="builds/${BUILD_BUILDID}"
              BLOB_BASE="https://${{ parameters.evidenceStorageAccountName }}.blob.core.windows.net/${{ parameters.evidenceContainerName }}/$PROVENANCE_PREFIX"
              FINISHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
              python3 usecase-ado-server-iaas/provenance/provenance.py create \
                --descriptor "$INPUT" \
                --sbom "$OUTPUT/sbom.spdx.json" \
                --sbom-uri "$BLOB_BASE/sbom.spdx.json" \
                --repository "$BUILD_REPOSITORY_URI" \
                --commit "$BUILD_SOURCEVERSION" \
                --build-id "$BUILD_BUILDID" \
                --build-definition "$BUILD_DEFINITIONNAME" \
                --build-uri "$BUILD_URI" \
                --started-at "$BUILD_QUEUEDTIME" \
                --finished-at "$FINISHED_AT" \
                --output "$OUTPUT/evidence.json"

              TRANSACTION_ID=$(python3 usecase-ado-server-iaas/provenance/ledger.py \
                --endpoint '${{ parameters.ledgerEndpoint }}' \
                --collection-id '${{ parameters.ledgerCollectionId }}' \
                --managed-identity-client-id '${{ parameters.ledgerWriterClientId }}' \
                --evidence "$OUTPUT/evidence.json" \
                --output "$OUTPUT/receipt.json")

              python3 usecase-ado-server-iaas/provenance/provenance.py report \
                --evidence "$OUTPUT/evidence.json" \
                --transaction-id "$TRANSACTION_ID" \
                --receipt-verified \
                --output "$OUTPUT/report.html"

              SUMMARY="$OUTPUT/summary.md"
              cat > "$SUMMARY" <<EOF
              ## Verified build provenance

              | | |
              | --- | --- |
              | **Artifact** | \`$IMAGE_URI\` |
              | **Ledger transaction** | \`$TRANSACTION_ID\` |
              | **Receipt verification** | Passed |
              | **Immutable evidence** | \`$BLOB_BASE\` |
              | **Evidence bundle** | [Open build artifacts]($ARTIFACT_URI) |
              EOF

              az storage blob upload-batch \
                --account-name '${{ parameters.evidenceStorageAccountName }}' \
                --auth-mode login \
                --destination '${{ parameters.evidenceContainerName }}' \
                --destination-path "$PROVENANCE_PREFIX" \
                --source "$OUTPUT" \
                --overwrite false \
                --only-show-errors \
                --output none

              echo "##vso[task.uploadsummary]$SUMMARY"
            displayName: Generate, record, and preserve verified evidence
          - task: PublishBuildArtifacts@1
            displayName: Publish provenance bundle
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/provenance'
              ArtifactName: provenance
              publishLocation: Container