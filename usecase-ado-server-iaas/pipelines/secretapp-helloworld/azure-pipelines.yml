# =============================================================================
# SecretApp - build a hello-world container and deploy it to Azure Container
# Instances, driven entirely inside Azure DevOps.
#
# Runs on the self-hosted "confidential-build-pool" (confidential ACI agents).
# Those agents have NO local Docker daemon, so the container image is built
# server-side with `az acr build`. Deployment uses an ARM template + `az`.
#
# Prerequisites (see README.md in this folder):
#   * Agent pool           : confidential-build-pool  (already registered)
#   * Service connection   : an ARM service connection to your subscription
#   * Azure Container Reg.  : Basic+ SKU with the admin user enabled
#   * The values below are set as pipeline variables (Edit > Variables) or
#     overridden at queue time - do NOT hardcode secrets here.
# =============================================================================

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - usecase-ado-server-iaas/pipelines/secretapp-helloworld/**

# Let the operator override any of these when queueing the pipeline.
parameters:
  - name: aciSku
    displayName: ACI SKU
    type: string
    default: Standard
    values:
      - Standard
      - Confidential

variables:
  # --- Set these as pipeline variables in the ADO UI (Pipeline > Edit > Variables) ---
  # azureServiceConnection : name of the ARM service connection
  # acrName                : name of your Azure Container Registry (no .azurecr.io)
  # resourceGroup          : resource group that holds the ACR and will hold the ACI
  # location               : Azure region, e.g. northeurope
  # -----------------------------------------------------------------------------------
  imageName: 'secretapp'
  imageTag: '$(Build.BuildId)'
  workDir: 'usecase-ado-server-iaas/pipelines/secretapp-helloworld'

pool: confidential-build-pool

stages:
  - stage: Build
    displayName: Build image (az acr build)
    jobs:
      - job: acr_build
        displayName: Server-side container build
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: 'az acr build'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                echo "Building $(imageName):$(imageTag) in registry $(acrName)..."
                az acr build \
                  --registry "$(acrName)" \
                  --image "$(imageName):$(imageTag)" \
                  --image "$(imageName):latest" \
                  --file "$(workDir)/app/Dockerfile" \
                  "$(workDir)/app"

  - stage: Deploy
    displayName: Deploy to ACI
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: aci_deploy
        displayName: Deploy container group
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: 'az deployment group create -> ACI'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                SKU="${{ parameters.aciSku }}"
                if [ "$SKU" != "Standard" ]; then
                  echo "##vso[task.logissue type=warning]Confidential ACI needs a per-image CCE policy generated by 'az confcom acipolicygen', which requires a Docker daemon. The confidential ACI build agents are dockerless, so this pipeline deploys Standard ACI. Run the Confidential path from a Docker-capable agent (see README)."
                fi

                LOGIN_SERVER=$(az acr show -n "$(acrName)" --query loginServer -o tsv)
                ACR_USER=$(az acr credential show -n "$(acrName)" --query username -o tsv)
                ACR_PASS=$(az acr credential show -n "$(acrName)" --query "passwords[0].value" -o tsv)
                echo "##vso[task.setvariable variable=acrPass;issecret=true]$ACR_PASS"

                STAMP=$(date +%m%d%H%M)
                CG_NAME="secretapp-$STAMP"
                DNS_LABEL="secretapp-$STAMP"
                IMAGE="$LOGIN_SERVER/$(imageName):$(imageTag)"

                echo "Deploying container group $CG_NAME (image: $IMAGE)..."
                FQDN=$(az deployment group create \
                  --resource-group "$(resourceGroup)" \
                  --template-file "$(workDir)/deploy/aci-helloworld.json" \
                  --parameters \
                      containerGroupName="$CG_NAME" \
                      location="$(location)" \
                      appImage="$IMAGE" \
                      registryServer="$LOGIN_SERVER" \
                      registryUsername="$ACR_USER" \
                      registryPassword="$ACR_PASS" \
                      dnsNameLabel="$DNS_LABEL" \
                  --query "properties.outputs.fqdn.value" -o tsv)

                echo "Deployed. App URL: http://$FQDN"
                echo "##vso[task.setvariable variable=appFqdn]$FQDN"

          - task: AzureCLI@2
            displayName: 'Smoke test (HTTP 200)'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                URL="http://$(appFqdn)"
                echo "Waiting for $URL ..."
                for i in $(seq 1 24); do
                  CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
                  if [ "$CODE" = "200" ]; then
                    echo "OK - $URL returned 200"
                    exit 0
                  fi
                  echo "  attempt $i: HTTP $CODE, retrying in 5s..."
                  sleep 5
                done
                echo "##vso[task.logissue type=warning]$URL did not return 200 within timeout; the image may still be pulling."
