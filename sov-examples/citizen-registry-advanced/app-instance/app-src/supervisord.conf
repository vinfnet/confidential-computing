[supervisord]
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
nodaemon=true
user=root

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=999
stdout_logfile=/var/log/supervisor/nginx.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/nginx.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

[program:gunicorn]
directory=/app
command=gunicorn --workers 4 --worker-class sync --bind 127.0.0.1:8000 --timeout 120 --access-logfile /var/log/citizen-registry/access.log --error-logfile /var/log/citizen-registry/error.log app:app
autostart=true
autorestart=true
priority=997
stdout_logfile=/var/log/supervisor/gunicorn.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/gunicorn.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=PYTHONUNBUFFERED=1

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface
