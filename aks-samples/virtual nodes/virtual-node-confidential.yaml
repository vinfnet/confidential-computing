# Confidential ACI workload via AKS Virtual Nodes
#
# This manifest schedules an ACI container group on the virtual-node with the
# confidential-compute add-on enabled.  The key pieces are:
#
#   1. annotations:
#        virtual-kubelet.io/confidential-compute-cce-policy
#          Base64-encoded Rego CCE policy generated by:
#            az confcom acipolicygen --image <image> --print-policy
#          The policy hard-codes every layer digest and must be regenerated
#          whenever the image changes. When present, the azure-aci provider
#          sets the backing container group SKU to Confidential.
#
#        virtual-kubelet.io/container-sku (OPTIONAL)
#          Set to "confidential" to request a confidential SKU without a
#          policy; the cce-policy annotation above already implies it.
#
#        microsoft.containerinstance.virtualnode.skippolicyvalidation (OPTIONAL)
#          Set to "true" only during early development to skip policy
#          enforcement.  NEVER use in production.
#
#   2. nodeSelector / tolerations that target virtual-node-aci-linux.
#
# CCE policy in this file
# -----------------------
# The policy embedded here is the allow-all DEBUG policy.  It permits any
# container image and any execution context and is suitable only for
# exploring the wiring.  Replace it with a generated restrictive policy
# before running any sensitive workload:
#
#   az confcom acipolicygen \
#     --image mcr.microsoft.com/azuredocs/aci-helloworld \
#     --print-policy
#
# Then substitute the printed base64 value into the annotation below.

---
apiVersion: v1
kind: Namespace
metadata:
  name: virtualnodes-confidential-demo

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aci-confidential-helloworld
  namespace: virtualnodes-confidential-demo
  labels:
    app: aci-confidential-helloworld
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aci-confidential-helloworld
  template:
    metadata:
      labels:
        app: aci-confidential-helloworld
      annotations:
        # ---------------------------------------------------------------
        # CCE Policy (REQUIRED for confidential ACI)
        # The azure-aci virtual-kubelet provider reads these annotations:
        #   virtual-kubelet.io/container-sku                    -> "confidential"
        #   virtual-kubelet.io/confidential-compute-cce-policy  -> base64 Rego
        # Replace the policy value with the output of:
        #   az confcom acipolicygen --image <your-image> --print-policy
        # The value below is the allow-all debug policy — NOT for production.
        # ---------------------------------------------------------------
        virtual-kubelet.io/container-sku: "confidential"
        virtual-kubelet.io/confidential-compute-cce-policy: "cGFja2FnZSBwb2xpY3kKYXBpX3ZlcnNpb24gOj0gIjAuMS4wIgoKYWxsb3dfYWxsIDo9IHRydWUK"
    spec:
      containers:
        - name: aci-confidential-helloworld
          image: mcr.microsoft.com/azuredocs/aci-helloworld
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "1"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "1Gi"
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/role: agent
        type: virtual-kubelet
      tolerations:
        - key: virtual-kubelet.io/provider
          operator: Exists
        - key: azure.com/aci
          effect: NoSchedule

---
apiVersion: v1
kind: Service
metadata:
  name: aci-confidential-helloworld
  namespace: virtualnodes-confidential-demo
spec:
  type: LoadBalancer
  selector:
    app: aci-confidential-helloworld
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
