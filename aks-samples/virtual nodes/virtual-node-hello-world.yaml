apiVersion: v1
kind: Namespace
metadata:
  name: virtualnodes-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aci-helloworld
  namespace: virtualnodes-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aci-helloworld
  template:
    metadata:
      labels:
        app: aci-helloworld
    spec:
      nodeSelector:
        kubernetes.io/role: agent
        kubernetes.io/os: linux
        type: virtual-kubelet
      tolerations:
      - key: virtual-kubelet.io/provider
        operator: Exists
      - key: azure.com/aci
        effect: NoSchedule
      containers:
      - name: aci-helloworld
        image: mcr.microsoft.com/azuredocs/aci-helloworld
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 1
            memory: 1Gi
          limits:
            cpu: 1
            memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: aci-helloworld
  namespace: virtualnodes-demo
spec:
  type: LoadBalancer
  selector:
    app: aci-helloworld
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP